
name: Build Kindle dashboard

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kindle-dash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check secret path
        env:
          SECRET_PATH: ${{ secrets.SECRET_PATH }}
        run: |
          if ! printf '%s' "$SECRET_PATH" | grep -Eq '^[A-Za-z0-9_-]{16,64}$'; then
            echo "::error::Repository secret SECRET_PATH is missing or invalid."
            exit 1
          fi

      - name: Build pages
        env:
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
          SECRET_PATH: ${{ secrets.SECRET_PATH }}
        run: |
          mkdir -p "site/$SECRET_PATH"
          python build.py --out "site/$SECRET_PATH"
          printf '<!doctype html><title>.</title>' > site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kindle-dash/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
